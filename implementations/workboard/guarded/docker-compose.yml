services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: workboard
      POSTGRES_PASSWORD: workboard
      POSTGRES_DB: workboard
    ports:
      - "55432:5432"
    volumes:
      - workboard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workboard -d workboard"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  workboard_pg:
